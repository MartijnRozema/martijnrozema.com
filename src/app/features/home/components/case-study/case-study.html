<section id="work" class="section case-study" aria-labelledby="work-title">
  <div class="heading">
    <p class="eyebrow" i18n="@@caseStudy.eyebrow">Work</p>
    <h2 id="work-title" i18n="@@caseStudy.title">
      MultiLang: multi-language content on monday.com boards
    </h2>
    <p class="status" i18n="@@caseStudy.status">Submitted to the marketplace</p>
  </div>
  <dl class="details">
    @for (section of sections; track section.label) {
      <div class="detail">
        <dt class="eyebrow">{{ section.label }}</dt>
        <dd class="body">
          @for (paragraph of section.paragraphs; track $index) {
            <p>{{ paragraph }}</p>
          }
        </dd>
      </div>
    }
  </dl>
</section>
