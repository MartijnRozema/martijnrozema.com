<section class="section" aria-labelledby="contact-title">
  <div class="contact">
    <p class="eyebrow" i18n="@@contact.eyebrow">Contact</p>
    <h2 id="contact-title" i18n="@@contact.title">Have monday work you can't staff?</h2>
    <p class="text" i18n="@@contact.text">
      Send me a short description of the project, what it does and when it needs to be live. I reply
      within a day. If it's a fit, we'll do a call on Friday and I'll come back with a scope and a
      price.
    </p>
    <div class="actions">
      <a class="button button--primary" [href]="contact.mailto">{{ contact.email }}</a>
    </div>
  </div>
</section>
